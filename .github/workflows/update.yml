# 공모전 목록 매일 갱신 — GitHub 가 대신 돌려 주는 자동 실행 설정.
# GitHub 저장소 안에서는 이 파일이 .github/workflows/update.yml 자리에 있어야 한다.
# (점으로 시작하는 폴더는 Synology Drive 가 동기화에서 빼므로, PC 에는 _웹게시/ 에 원본을 둔다.)
name: 공모전 목록 매일 갱신

on:
  schedule:
    - cron: '0 22 * * *'      # 세계 표준시 22:00 = 한국 시각 매일 07:00 (GitHub 사정으로 몇십 분 늦을 수 있다)
  workflow_dispatch:           # 저장소의 Actions 화면에서 '지금 실행' 단추로도 돌릴 수 있다

permissions:
  contents: write              # 받은 자료를 저장소에 다시 저장
  pages: write                 # 웹 주소로 내보내기
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul           # 오늘 날짜와 남은 날을 한국 시각으로 센다
      PYTHONUTF8: '1'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 여섯 사이트에서 목록 받기
        run: python3 _만들기/collect.py

      # 받은 자료(_기록.json)와 결과물을 저장소에 남긴다.
      # 내일 '새로 올라옴'을 가리는 데 쓰이고, 저장소에 60일 동안 변화가 없으면
      # GitHub 가 자동 실행을 꺼 버리는 것도 이 저장으로 막는다.
      - name: 바뀐 자료 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "목록 갱신 $(date +%F)"
          git push

      - name: 웹에 올릴 꾸러미 만들기
        run: |
          mkdir _site
          cp 공모전모음.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
